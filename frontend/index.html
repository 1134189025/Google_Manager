<!doctype html>
<html lang="zh-CN" data-theme="dark" data-scheme="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Google Manager</title>
    <meta name="description" content="个人数字资产管理桌面工作区：谷歌账号、费用续费、AI 订阅、支付卡、服务器监控、SSH 终端与域名管理" />
    <script>
        // 首帧前同步主题，消除启动闪烁；兼容 gm.lg.theme（light/dark/auto）与旧键 darkMode
        (function () {
            try {
                var pref = localStorage.getItem('gm.lg.theme');
                var mode = null;
                if (pref) {
                    try { mode = JSON.parse(pref); } catch (_) { mode = pref; }
                }
                if (mode !== 'light' && mode !== 'dark' && mode !== 'auto') {
                    var legacy = localStorage.getItem('darkMode');
                    mode = legacy === null ? 'dark' : (JSON.parse(legacy) === true ? 'dark' : 'light');
                }
                var scheme = mode === 'auto'
                    ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
                    : mode;
                document.documentElement.dataset.scheme = scheme;
                document.documentElement.dataset.theme = scheme;
                document.documentElement.dataset.themePref = mode;
            } catch (e) {
                document.documentElement.dataset.scheme = 'dark';
                document.documentElement.dataset.theme = 'dark';
                document.documentElement.dataset.themePref = 'dark';
            }
        })();
    </script>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
